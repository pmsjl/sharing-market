# 公共配置示例
#
# 复制为 application.yml 后再通过环境变量或本机配置注入真实凭据。
# 不要把真实的数据库、Redis、微信、OSS 或服务间 Token 提交到 Git。

spring:
  application:
    name: 智能 AI 校园二手交易平台

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    async:
      request-timeout: 6000000

  session:
    timeout: 2592000

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/trade}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  data:
    redis:
      database: ${REDIS_DATABASE:0}
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:5000}
      password: ${REDIS_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 10MB

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8102}
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

wx:
  mp:
    token: ${WX_MP_TOKEN:}
    aesKey: ${WX_MP_AES_KEY:}
    appId: ${WX_MP_APP_ID:}
    secret: ${WX_MP_SECRET:}
    config-storage:
      http-client-type: HttpClient
      key-prefix: wx
      redis:
        host: ${WX_REDIS_HOST:127.0.0.1}
        port: ${WX_REDIS_PORT:6379}
      type: Memory
  open:
    appId: ${WX_OPEN_APP_ID:}
    appSecret: ${WX_OPEN_APP_SECRET:}

oss:
  client:
    accessKey: ${OSS_ACCESS_KEY:}
    secretKey: ${OSS_SECRET_KEY:}
    endpoint: ${OSS_ENDPOINT:https://oss-cn-shenzhen.aliyuncs.com}
    bucket: ${OSS_BUCKET:}
    host: ${OSS_HOST:}

knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.xiaobaitiao.springbootinit.controller

jwt:
  tokenHeader: Authorization
  expiration: 36000000
  tokenHead: Bearer

ai:
  agent:
    base-url: ${AI_AGENT_BASE_URL:http://127.0.0.1:8103}
    internal-token: ${AI_AGENT_INTERNAL_TOKEN:}
    connect-timeout-ms: ${AI_AGENT_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AI_AGENT_READ_TIMEOUT_MS:60000}
    pending-timeout-ms: ${AI_AGENT_PENDING_TIMEOUT_MS:80000}
