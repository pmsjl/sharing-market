# 公共配置示例
#
# 本地可复制为 application.yml；生产部署直接启用已提交的 application-prod.yml。
# 不要把真实的数据库、Redis、OSS 或服务间 Token 提交到 Git。

spring:
  application:
    name: 智能 AI 校园二手交易平台

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    async:
      request-timeout: 6000000

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/trade}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  data:
    redis:
      database: ${REDIS_DATABASE:0}
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      timeout: ${REDIS_TIMEOUT:5000}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:5000}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

  servlet:
    multipart:
      max-file-size: 10MB

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${PORT:${SERVER_PORT:8102}}
  forward-headers-strategy: framework
  servlet:
    context-path: /api

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:8080}

market:
  campus-coin:
    initial-balance: ${CAMPUS_COIN_INITIAL_BALANCE:1000.00}
    max-admin-grant: ${CAMPUS_COIN_MAX_ADMIN_GRANT:100000.00}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

oss:
  client:
    accessKey: ${OSS_ACCESS_KEY:}
    secretKey: ${OSS_SECRET_KEY:}
    endpoint: ${OSS_ENDPOINT:https://oss-cn-shenzhen.aliyuncs.com}
    bucket: ${OSS_BUCKET:}
    host: ${OSS_HOST:}

knife4j:
  enable: ${API_DOCS_ENABLED:true}
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.xiaobaitiao.springbootinit.controller

auth-token:
  header: Authorization
  prefix: Bearer

ai:
  access:
    user-daily-limit: ${AI_USER_DAILY_LIMIT:10}
    global-daily-limit: ${AI_GLOBAL_DAILY_LIMIT:100}
    timezone: ${AI_QUOTA_TIMEZONE:Asia/Shanghai}
  agent:
    base-url: ${AI_AGENT_BASE_URL:http://127.0.0.1:8103}
    internal-token: ${AI_AGENT_INTERNAL_TOKEN:}
    connect-timeout-ms: ${AI_AGENT_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AI_AGENT_READ_TIMEOUT_MS:120000}
    pending-timeout-ms: ${AI_AGENT_PENDING_TIMEOUT_MS:140000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
      show-details: never
